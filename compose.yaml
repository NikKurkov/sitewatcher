services:
  sitewatcher:
    build: .
    env_file: .env
    environment:
      DATABASE_PATH: /data/sitewatcher.db
      SITEWATCHER_CONFIG: /data/config.yaml
    volumes:
      - sitewatcher-data:/data
    restart: unless-stopped

  web:
    profiles: [web]
    build: .
    command: ["uvicorn", "sitewatcher.web.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      DATABASE_PATH: /data/sitewatcher.db
      SITEWATCHER_CONFIG: /data/config.yaml
    volumes:
      - sitewatcher-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

volumes:
  sitewatcher-data:
