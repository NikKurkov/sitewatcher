{% load i18n %}
<div class="history-legend" aria-label="{% translate 'HTTP history legend' %}">
    <span><i class="legend-successful" aria-hidden="true"></i>{% translate 'Available' %}</span>
    <span><i class="legend-failed" aria-hidden="true"></i>{% translate 'Unavailable' %}</span>
    <span><i class="legend-unknown" aria-hidden="true"></i>{% translate 'Unknown result' %}</span>
    <span><i class="legend-no-data" aria-hidden="true"></i>{% translate 'No measurements' %}</span>
</div>
