<div class="field"><label for="{{ field.name }}">{{ field.label }}</label><select id="{{ field.name }}" name="{{ field.name }}"><option value="" {% if not field.value %}selected{% endif %}>Default ({{ field.default }})</option><option value="on" {% if field.value == 'on' %}selected{% endif %}>On</option><option value="off" {% if field.value == 'off' %}selected{% endif %}>Off</option></select></div>
