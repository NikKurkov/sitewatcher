{% load i18n %}
<nav class="periods" aria-label="{% translate 'History period' %}" title="{% translate 'History period' %}">
    <a href="?{% if report.domain %}domain={{ report.domain|urlencode }}&amp;{% endif %}{% if query %}q={{ query|urlencode }}&amp;{% endif %}{% if status %}status={{ status }}&amp;{% endif %}days=1{% if history_query %}&amp;{{ history_query }}{% endif %}"
        {% if report.days == 1 %}aria-current="page"{% endif %}
    >{% translate '24h' %}</a>
    <a href="?{% if report.domain %}domain={{ report.domain|urlencode }}&amp;{% endif %}{% if query %}q={{ query|urlencode }}&amp;{% endif %}{% if status %}status={{ status }}&amp;{% endif %}days=7{% if history_query %}&amp;{{ history_query }}{% endif %}"
        {% if report.days == 7 %}aria-current="page"{% endif %}
    >{% translate '7d' %}</a>
    <a href="?{% if report.domain %}domain={{ report.domain|urlencode }}&amp;{% endif %}{% if query %}q={{ query|urlencode }}&amp;{% endif %}{% if status %}status={{ status }}&amp;{% endif %}days=30{% if history_query %}&amp;{{ history_query }}{% endif %}"
        {% if report.days == 30 %}aria-current="page"{% endif %}
    >{% translate '30d' %}</a>
</nav>
