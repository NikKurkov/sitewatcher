<figure class="response-chart"><figcaption><span class="eyebrow">Response time</span><strong>{% if report.totals.latency_ms != None %}{{ report.totals.latency_ms|floatformat:0 }} ms{% else %}No data{% endif %}</strong><span class="muted">Average of successful HTTP responses</span></figcaption>
{% if report.chart.dots %}<div class="chart-scale">{{ report.chart.maximum|floatformat:0 }} ms</div><svg viewBox="-5 0 1010 165" role="img" aria-labelledby="latency-title-{{ report.domain }} latency-desc-{{ report.domain }}"><title id="latency-title-{{ report.domain }}">HTTP response time in milliseconds</title><desc id="latency-desc-{{ report.domain }}">Each point is an average of successful responses in a time bucket. Missing buckets break the line. The table below contains exact values.</desc><path class="chart-grid" d="M0 18H1000 M0 84H1000 M0 150H1000"/>{% for segment in report.chart.segments %}<polyline class="chart-line" points="{{ segment }}" />{% endfor %}{% for point in report.chart.dots %}<circle class="chart-dot" cx="{{ point.x }}" cy="{{ point.y }}" r="2.5"/>{% endfor %}</svg><div class="chart-axis"><span>{{ report.start.label }}</span><span>{{ report.end.label }}</span></div>{% else %}<div class="chart-empty">No successful response times recorded in this period.</div>{% endif %}
</figure>
