{% load i18n l10n %}
<figure class="response-chart">
    <figcaption>
        <span class="eyebrow">{% translate 'Response time' %}</span>
        <strong>{% if report.totals.latency_ms != None %}{% blocktranslate with latency=report.totals.latency_ms|floatformat:0 %}{{ latency }} ms{% endblocktranslate %}{% else %}{% translate 'No data' %}{% endif %}</strong>
        <span class="muted">{% translate 'Average of successful HTTP responses' %}</span>
    </figcaption>
    {% if report.chart.dots %}
        <div class="chart-scale">{% blocktranslate with latency=report.chart.maximum|floatformat:0 %}{{ latency }} ms{% endblocktranslate %}</div>
        <svg viewBox="-5 0 1010 165"
            role="group"
            aria-labelledby="latency-title-{{ report.domain }} latency-desc-{{ report.domain }}"
        >
            <title id="latency-title-{{ report.domain }}">{% translate 'HTTP response time in milliseconds' %}</title>
            <desc id="latency-desc-{{ report.domain }}">{% translate 'Each point is an average of successful responses in a time bucket. Missing buckets break the line. The table below contains exact values.' %}</desc>
            <path class="chart-grid" d="M0 18H1000 M0 84H1000 M0 150H1000"/>
            {% for segment in report.chart.segments %}
                <polyline class="chart-line" points="{{ segment }}" />
            {% endfor %}
            {% for point in report.chart.dots %}
                <g class="chart-point"
                    tabindex="0"
                    role="img"
                    aria-label="{{ point.label }} · {% blocktranslate with latency=point.value|floatformat:1 %}{{ latency }} ms{% endblocktranslate %}"
                >
                    <circle class="chart-dot" cx="{{ point.x|unlocalize }}" cy="{{ point.y|unlocalize }}" r="2.5"/>
                </g>
            {% endfor %}
        </svg>
        <div class="chart-tooltip" role="tooltip" hidden>
        </div>
        <div class="chart-axis">
            <span>{{ report.start.label }}</span>
            <span>{{ report.end.label }}</span>
        </div>
    {% else %}
        <div class="chart-empty">{% translate 'No successful response times recorded in this period.' %}</div>
    {% endif %}
</figure>
