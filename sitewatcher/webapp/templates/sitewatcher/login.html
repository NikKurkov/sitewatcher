{% extends 'sitewatcher/base.html' %}
{% block content %}
<main><h1>Sign in to SiteWatcher</h1>
<form method="post">{% csrf_token %}{{ form.as_p }}
<input type="hidden" name="next" value="{{ next }}">
<button type="submit">Sign in</button></form>
<p>For local password recovery, run <code>sitewatcher password</code> on the server.</p>
</main>
{% endblock %}
