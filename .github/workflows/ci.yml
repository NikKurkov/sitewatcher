name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,web]'
      - run: ruff check sitewatcher tests
      - run: pytest
      - run: python -m sitewatcher.main --help

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build sitewatcher
      - run: docker compose run --rm sitewatcher sitewatcher check_all
      - name: Smoke test web container
        run: |
          echo 'WEB_OWNER_ID=123456789' >> .env
          echo 'WEB_SESSION_SECRET=ci-only-secret-with-sufficient-length-123456789' >> .env
          WEB_HASH=$(docker compose run --rm --no-deps --entrypoint python sitewatcher -c 'from sitewatcher.web.auth import hash_password; print(hash_password("ci-only-password"))')
          echo "WEB_PASSWORD_HASH=$WEB_HASH" >> .env
          docker compose --profile web config --quiet
          docker compose --profile web up -d --build web
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8000/login; then
              exit 0
            fi
            sleep 1
          done
          docker compose --profile web logs web
          exit 1
