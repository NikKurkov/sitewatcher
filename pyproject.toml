[project]
name = "sitewatcher"
version = "0.2.0"
description = "Lightweight async website monitoring bot (Telegram)"
authors = [{ name = "Nikolay Kurkov", email = "nikkurkov@gmail.com" }]
requires-python = ">=3.12"

# Runtime dependencies
dependencies = [
  # Lock to safe major/minor ranges to avoid future breaking changes
  "httpx[http2,socks]>=0.28.1,<0.29",
  "pydantic>=2.11.7,<3",
  "PyYAML>=6.0.2,<7",
  "python-telegram-bot[job-queue]>=22.3,<23",
  "icmplib>=3,<4; platform_system != 'Windows'",
  "python-dotenv>=1.1.1,<2",
  "dnspython>=2.7.0,<3",
  "tldextract>=5.3.0,<6",
]

# Project metadata (helps on PyPI and tooling)
readme = "README.md"

# CLI entrypoint: `sitewatcher <command>`
[project.scripts]
sitewatcher = "sitewatcher.main:main"

[project.urls]
Homepage = "https://github.com/NikKurkov/sitewatcher"
Repository = "https://github.com/NikKurkov/sitewatcher"
Issues = "https://github.com/NikKurkov/sitewatcher/issues"

# Developer tools
[project.optional-dependencies]
rich = ["rich>=14,<16"]
web = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
  "itsdangerous>=2.2,<3",
]
dev = [
  "ruff>=0.16,<1",
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sitewatcher*"]

[tool.setuptools.package-data]
sitewatcher = ["data/deface_markers.txt", "data/config.yaml.example"]
"sitewatcher.web" = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F", "B"]
ignore = []

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
