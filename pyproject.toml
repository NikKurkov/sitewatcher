[project]
name = "sitewatcher"
version = "0.3.0"
description = "Private website monitoring workspace with optional Telegram alerts"
authors = [{ name = "Nikolay Kurkov", email = "nikkurkov@gmail.com" }]
requires-python = ">=3.12"

# Runtime dependencies
dependencies = [
  # Lock to safe major/minor ranges to avoid future breaking changes
  "httpx[http2,socks]>=0.28.1,<0.29",
  "pydantic>=2.14.2,<3",
  "PyYAML>=6.0.2,<7",
  "python-telegram-bot[job-queue]>=22.4,<23",
  "icmplib>=3,<4; platform_system != 'Windows'",
  "python-dotenv>=1.1.1,<2",
  "dnspython>=2.9.1,<3",
  "tldextract>=5.3.0,<6",
  "Django>=5.2.8,<5.3",
  "django-axes>=8.3.1,<9",
  "uvicorn>=0.35,<1",
]

# Project metadata (helps on PyPI and tooling)
readme = "README.md"

# CLI entrypoint: `sitewatcher <command>`
[project.scripts]
sitewatcher = "sitewatcher.main:main"

[project.urls]
Homepage = "https://github.com/NikKurkov/sitewatcher"
Repository = "https://github.com/NikKurkov/sitewatcher"
Issues = "https://github.com/NikKurkov/sitewatcher/issues"

# Developer tools
[project.optional-dependencies]
rich = ["rich>=14,<16"]
dev = [
  "ruff>=0.16,<1",
  "pytest>=8,<10",
  "pytest-django>=4.11,<5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sitewatcher*"]

[tool.setuptools.package-data]
sitewatcher = ["data/deface_markers.txt", "data/config.yaml.example"]

"sitewatcher.webapp" = ["templates/sitewatcher/*.html", "templates/sitewatcher/partials/*.html", "static/sitewatcher/*", "locale/*/LC_MESSAGES/*.po", "locale/*/LC_MESSAGES/*.mo"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F", "B"]
ignore = []

[tool.pytest.ini_options]
addopts = "-q"
DJANGO_SETTINGS_MODULE = "sitewatcher.webapp.settings"
testpaths = ["tests"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
